<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap Fullstack 180 Jours</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🚀 Roadmap Fullstack Developer (180 Jours)</h1>
        <p>Apprenez et pratiquez pas à pas. Règle : 1 jour = 1 leçon !</p>
    </header>

    <main class="container">
        <section class="progress-section">
            <h2>Votre Progression</h2>
            <div class="progress-bar">
                <div id="progress-fill" style="width: 0%;"></div>
            </div>
            <p><span id="completed-count">0</span> / 180 jours complétés</p>
        </section>

        <section class="roadmap-grid" id="roadmap-grid">
            <!-- Les cartes des leçons seront générées automatiquement par script.js -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
